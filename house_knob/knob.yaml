# House Knob bridge configuration.
# HA_URL / HA_TOKEN come from the environment (.envrc).

listen:
  host: 0.0.0.0
  port: 8765

climate:
  - id: indoors
    name: Indoors
    # TODO(on site): the authoritative indoor Netatmo is currently powered off.
    # When it is back, confirm which station/sensor it is (sensor.dnevni_temperature,
    # a Netatmo "Dnevni" station, is the one showing unavailable) and switch `sensor` to it.
    sensor: sensor.oxymoron_temperature   # Netatmo station "Oxymoron": authoritative room temperature
    schedule:                # HA helpers; floor setpoint = set point + that floor's offset
      switch: input_boolean.indoors_schedule   # Off/Cool clear it, Heat sets it
      wake: input_number.indoors_wake          # 06:00-23:00
      sleep: input_number.indoors_sleep        # 23:00-06:00
      away: input_number.indoors_away          # house mode Away
      offsets:               # all assume Tuya floor calibration 0 on the thermostat
        climate.dnevni: input_number.offset_dnevni
        climate.dnevni_2: input_number.offset_dnevni_2
        climate.hodnik: input_number.offset_hodnik
    warn_if_open:            # warn on the knob while heating and any of these are open
      - cover.velux_window_roof_window
      - cover.velux_window_roof_window_2
      - cover.velux_window_roof_window_3
    heat:
      min: 15
      max: 28
      step: 0.5
      entities:
        - climate.dnevni
        - climate.dnevni_2
        - climate.hodnik
    cool:
      min: 18
      max: 30
      step: 1
      entities:
        - climate.9424b844f92c   # Klima - Dnevni
        - climate.9424b82c5fa0   # Klima - Spavaća
        - climate.9424b82e9242   # Klima - Klinci

  - id: outdoors
    name: Outdoors
    sensor: sensor.oxymoron_outdoor_module_temperature   # Netatmo "Oxymoron" outdoor module; display only
    # TODO(on site): a dedicated Netatmo module is planned for the terrace; switch `sensor:` to it then.
    heat:
      absolute: true         # heaters take the target directly (floors indoors use a relative nudge)
      min: 10
      max: 30
      step: 1
      entities:
        - climate.heater
        - entity: climate.wonderwall_art_smart
          hvac_mode: heat_cool
        - entity: climate.wonderwall_art_smart_2
          hvac_mode: heat_cool
    cool:
      min: 18
      max: 30
      step: 1
      entities:
        - climate.580d0d34e617   # terrace AC

lights:                      # Hue rooms. Every Hue scene of the room becomes a preset
  - entity: light.terasa     # (rest on the centre and turn); `presets` pins some first.
    name: Terasa
    hue_group: Terasa
  - entity: light.ambiance
    name: Ambiance
    hue_group: Ambiance
    presets:
      Božić: scene.ambiance_bozic
  - entity: light.reflektor
    name: Reflektor
    hue_group: Reflektor

covers:                      # each group moves all three roof windows' units together
  - id: windows
    name: Windows
    icon: window
    updown: true
    labels: [Closed, Open]
    entities: [cover.velux_window_roof_window, cover.velux_window_roof_window_2, cover.velux_window_roof_window_3]
  - id: blinds
    name: Blinds
    icon: blinds
    updown: true
    labels: [Down, Up]
    entities: [cover.velux_internal_cover_blinds, cover.velux_internal_cover_blinds_2, cover.velux_internal_cover_blinds_3]
  - id: shutters
    name: Shutters
    icon: roller_shades
    updown: true
    labels: [Down, Up]
    entities: [cover.velux_external_cover_roller_shutter, cover.velux_external_cover_roller_shutter_2, cover.velux_external_cover_roller_shutter_3]

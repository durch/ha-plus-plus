<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>House</title>
<!--
  House panel for e-ink browsers (old Kindle WebKit included): tables instead of
  flexbox, ES3 only, XMLHttpRequest instead of WebSocket. Black and white, no
  animation, and a row is only redrawn when its content changes, so the screen
  does not flash. Talks to the same bridge as the knob:
    GET  /panel/state?rev=…  (held open until the house changes)
    POST /panel/cmd          (one hk/1 knob message)
-->
<style>
html, body { margin: 0; padding: 0; background: #fff; color: #000; }
body { font-family: Helvetica, Arial, sans-serif; font-weight: bold;
       -webkit-user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0);
       -webkit-text-size-adjust: none; }
table { border-collapse: collapse; width: 100%; table-layout: fixed; }
td { padding: 0; text-align: center; vertical-align: middle; overflow: hidden; }
.row { border-bottom: 2px solid #000; }
.gap { border-bottom: 6px solid #000; }
td.name { text-align: left; padding-left: 2%; }
.small { font-weight: normal; }
td.b { border-left: 2px solid #000; }
td.on { background: #000; color: #fff; }
td.na { color: #999; }
#scenes { display: none; }
#note { font-weight: normal; text-align: center; }
</style>
</head>
<body>
<div id="main"></div>
<div id="scenes"></div>
<div id="note"></div>
<script>
var controls = [];      // as the bridge last described them
var rev = '';
var held = {};          // id -> {until, fields}: what was just tapped wins for a moment
var drawn = {};         // row key -> html, to redraw only what changed
var sceneFor = null;    // id of the light whose scene list is open
var note = '';
var H = 0, U = 1;

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
}
function now() { return new Date().getTime(); }

function view(c) {      // the control as shown: bridge state, plus what was just tapped
  var h = held[c.id], out = {}, k;
  for (k in c) out[k] = c[k];
  if (h) {
    if (h.until < now()) delete held[c.id];
    else for (k in h.fields) out[k] = h.fields[k];
  }
  return out;
}
function hold(id, fields, ms) {
  var h = held[id], k;
  if (!h || h.until < now()) h = held[id] = {fields: {}};
  h.until = now() + (ms || 4000);
  for (k in fields) h.fields[k] = fields[k];
}
function byId(id) {
  for (var i = 0; i < controls.length; i++) if (controls[i].id == id) return controls[i];
  return null;
}

// ── drawing ──
function cell(w, cls, label, onclick, size) {
  return '<td width="' + w + '%" class="' + cls + '"' + (onclick ? ' onclick="' + onclick + '"' : '') +
         ' style="font-size:' + Math.round((size || 24) * U) + 'px">' + label + '</td>';
}
function nameCell(w, c, sub) {
  return '<td width="' + w + '%" class="name' + (c.available ? '' : ' na') + '">' +
         '<div style="font-size:' + Math.round(22 * U) + 'px">' + esc(c.name) + '</div>' +
         '<div class="small" style="font-size:' + Math.round(19 * U) + 'px">' + (esc(sub) || '&nbsp;') + '</div></td>';
}
function seg(w, label, active, onclick, size) {
  return cell(w, 'b' + (active ? ' on' : ''), label, onclick, size);
}
function signed(v) { return (v > 0 ? '+' : '') + (Math.round(v * 10) / 10); }

function rowHtml(i) {
  var c = view(controls[i]), h = '', sub;
  if (c.kind == 'house') {
    h += seg(50, 'Home', c.mode == 'home', "mode(" + i + ",'home')", 30);
    h += seg(50, 'Away', c.mode == 'away', "mode(" + i + ",'away')", 30);
  } else if (c.kind == 'climate') {
    var rel = c.min < 0;                     // relative group: value is a nudge
    var off = c.mode == 'off';
    sub = c.warning || (rel || off ? c.primary : (c.secondary || '').replace('Now ', ''));
    h += nameCell(24, c, sub);
    h += seg(12, 'Off', off, "mode(" + i + ",'off')", 21);
    h += seg(13, 'Heat', c.mode == 'heat', "mode(" + i + ",'heat')", 21);
    h += seg(13, 'Cool', c.mode == 'cool', "mode(" + i + ",'cool')", 21);
    if (off) h += cell(38, 'b', '&nbsp;');
    else {
      h += cell(12, 'b', '&minus;', 'step(' + i + ',-1)', 40);
      h += cell(14, 'b', rel ? signed(c.value) + '&deg;' : Math.round(c.value) + '&deg;', '', 26);
      h += cell(12, 'b', '+', 'step(' + i + ',1)', 40);
    }
  } else if (c.kind == 'light') {
    h += nameCell(24, c, c.on ? (c.mode || '') : '');
    h += seg(12, 'Off', !c.on, 'onoff(' + i + ',0)', 21);
    h += seg(13, 'On', c.on, 'onoff(' + i + ',1)', 21);
    if (c.adjustable) {
      h += cell(11, 'b', '&minus;', 'step(' + i + ',-2)', 40);
      h += cell(13, 'b', c.on ? Math.round(c.value) + '%' : '&nbsp;', '', 22);
      h += cell(11, 'b', '+', 'step(' + i + ',2)', 40);
    } else h += cell(35, 'b', '&nbsp;');
    h += (c.modes && c.modes.length) ? cell(16, 'b', 'Scene', 'openScenes(' + i + ')', 21) : cell(16, 'b', '&nbsp;');
  } else if (c.kind == 'cover') {
    var lab = c.labels || ['Closed', 'Open'];
    var moving = c.primary == 'Moving', mixed = c.primary == 'Mixed';
    h += nameCell(24, c, moving ? 'Moving' : (c.secondary || ''));
    h += seg(38, esc(lab[0]), !c.on && !mixed, 'cover(' + i + ',0)', 24);
    h += seg(38, esc(lab[1]), c.on && !mixed, 'cover(' + i + ',100)', 24);
  }
  return h;
}

function rowsOrder() {   // house mode first, then in the bridge's order
  var order = [], i;
  for (i = 0; i < controls.length; i++) if (controls[i].kind == 'house') order.push(i);
  for (i = 0; i < controls.length; i++) if (controls[i].kind != 'house') order.push(i);
  return order;
}

function draw() {
  var main = document.getElementById('main'), order = rowsOrder(), i, k, c, next, html, el;
  if (!order.length) return;
  var w = window.innerWidth || document.documentElement.clientWidth || 600;
  var h = window.innerHeight || document.documentElement.clientHeight || 800;
  var noteH = note ? Math.round(30 * w / 600) : 0;
  var rh = Math.floor((h - noteH) / order.length) - 3;
  var key = order.join(',') + '|' + w + '|' + rh;
  if (drawn.frame != key) {            // first draw, or the screen changed size
    U = w / 600; H = rh; drawn = {frame: key};
    html = '';
    for (k = 0; k < order.length; k++) {
      c = controls[order[k]]; next = controls[order[k + 1]];
      html += '<table class="' + (next && next.kind != c.kind ? 'gap' : 'row') + '"><tr id="r' + order[k] +
              '" style="height:' + rh + 'px"></tr></table>';
    }
    main.innerHTML = html;
  }
  for (k = 0; k < order.length; k++) {
    i = order[k]; html = rowHtml(i);
    if (drawn[i] != html) {
      el = document.getElementById('r' + i);
      setRow(el, html);
      drawn[i] = html;
    }
  }
  el = document.getElementById('note');
  if (drawn.note != note) {
    el.style.fontSize = Math.round(18 * U) + 'px';
    el.innerHTML = esc(note); drawn.note = note;
  }
  if (sceneFor != null) drawScenes();
}
function setRow(tr, html) {            // innerHTML on a <tr> is unreliable in old engines
  var box = document.createElement('div');
  box.innerHTML = '<table><tr>' + html + '</tr></table>';
  var src = box.getElementsByTagName('tr')[0];
  while (tr.firstChild) tr.removeChild(tr.firstChild);
  while (src.firstChild) tr.appendChild(src.firstChild);
}

// ── scenes ──
function openScenes(i) { sceneFor = controls[i].id; drawn.scenes = null; drawScenes(); }
function closeScenes() {
  sceneFor = null;
  document.getElementById('scenes').style.display = 'none';
  document.getElementById('main').style.display = 'block';
}
function drawScenes() {
  var c = byId(sceneFor);
  if (!c) { closeScenes(); return; }
  c = view(c);
  var m = c.modes || [], rows = Math.ceil(m.length / 2) + 1, k, html;
  var rh = Math.min(Math.floor((window.innerHeight || 800) / rows) - 3, Math.round(110 * U));
  var size = Math.round(Math.min(24, rh / U * 0.36) * U);
  html = '<table class="gap"><tr style="height:' + rh + 'px">' +
         '<td class="name" style="font-size:' + Math.round(26 * U) + 'px">' + esc(c.name) + '</td>' +
         '<td class="b" onclick="closeScenes()" style="font-size:' + Math.round(24 * U) + 'px">Back</td></tr></table>';
  for (k = 0; k < m.length; k += 2) {
    html += '<table class="row"><tr style="height:' + rh + 'px">';
    html += sceneCell(c, m, k, size) + sceneCell(c, m, k + 1, size) + '</tr></table>';
  }
  if (drawn.scenes != html) {
    document.getElementById('scenes').innerHTML = html;
    drawn.scenes = html;
  }
  document.getElementById('main').style.display = 'none';
  document.getElementById('scenes').style.display = 'block';
}
function sceneCell(c, m, k, size) {
  if (k >= m.length) return '<td class="b">&nbsp;</td>';
  return '<td class="' + (k % 2 ? 'b' : '') + (c.on && c.mode == m[k] ? ' on' : '') +
         '" onclick="scene(' + k + ')" style="font-size:' + size + 'px">' + esc(m[k]) + '</td>';
}
function scene(k) {
  var c = byId(sceneFor);
  if (!c) return;
  hold(c.id, {on: true, mode: c.modes[k]}, 6000);
  send({t: 'mode', id: c.id, mode: c.modes[k]});
  closeScenes();
  draw();
}

// ── taps ──
function mode(i, m) {
  var c = controls[i];
  if (view(c).mode == m) return;
  hold(c.id, {mode: m, on: m != 'off' && m != 'away'}, 8000);
  send({t: 'mode', id: c.id, mode: m});
  draw();
}
function onoff(i, want) {
  var c = controls[i];
  if (!!view(c).on == !!want) return;
  hold(c.id, {on: !!want}, 5000);
  // The bridge has "toggle" for lights; it compares against the same shown state.
  send({t: 'toggle', id: c.id});
  draw();
}
function step(i, n) {
  var c = controls[i], v = view(c);
  if (c.kind == 'light' && !v.on && n < 0) return;
  var value = (c.kind == 'light' && !v.on ? 0 : v.value) + n * c.step;
  value = Math.max(c.min, Math.min(c.max, Math.round(value * 100) / 100));
  if (c.kind == 'light' && value < c.step) value = c.step;   // minus never switches off
  hold(c.id, c.kind == 'light' ? {value: value, on: true} : {value: value}, 5000);
  send({t: 'adjust', id: c.id, value: value});
  draw();
}
function cover(i, value) {
  var c = controls[i];
  hold(c.id, {on: value > 0, primary: 'Moving', secondary: ''}, 6000);
  send({t: 'adjust', id: c.id, value: value});
  draw();
}

// ── talking to the bridge ──
var seq = 0;
function request(method, url, body, done) {
  var x = new XMLHttpRequest(), finished = false;
  var timer = setTimeout(function () { finish(null); try { x.abort(); } catch (e) {} }, 40000);
  function finish(data) {
    if (finished) return;
    finished = true; clearTimeout(timer); done(data);
  }
  x.onreadystatechange = function () {
    if (x.readyState != 4) return;
    var data = null;
    if (x.status == 200) { try { data = JSON.parse(x.responseText); } catch (e) {} }
    finish(data);
  };
  x.open(method, url, true);
  if (body) x.setRequestHeader('Content-Type', 'text/plain');
  x.send(body || null);
}
function apply(data) {
  controls = data.controls; rev = data.rev;
  note = !data.ha ? 'Home Assistant offline' : (data.dry_run ? 'Dry run: nothing in the house changes' : '');
  draw();
}
function send(msg) {
  msg.seq = ++seq;
  request('POST', 'cmd', JSON.stringify(msg), function (data) {
    if (!data) { held = {}; note = 'No connection to the house'; draw(); return; }
    if (!data.ok) { delete held[msg.id]; }
    apply(data);
    if (!data.ok && data.message) { note = data.message; draw(); }
  });
}
var retry = null;
function poll() {
  retry = null;
  request('GET', 'state?rev=' + encodeURIComponent(rev) + '&_=' + now(), null, function (data) {
    if (data) { apply(data); setTimeout(poll, 50); }
    else { note = 'No connection to the house'; draw(); rev = ''; retry = setTimeout(poll, 2000); }
  });
}
function wake() {       // the Kindle woke up or WiFi came back: do not sit out the retry wait
  if (retry) { clearTimeout(retry); poll(); }
}
if (window.addEventListener) {
  window.addEventListener('online', wake, false);
  window.addEventListener('focus', wake, false);
  document.addEventListener('visibilitychange', wake, false);
}
window.onresize = function () { draw(); };
setInterval(function () {          // let expired taps fall back to the bridge's truth
  for (var id in held) if (held[id].until < now()) { delete held[id]; draw(); }
}, 1000);
poll();
</script>
</body>
</html>

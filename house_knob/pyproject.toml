[project]
name = "ha-knob"
version = "0.1.0"
description = "Home Assistant bridge for the roon-knob firmware"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ha-knob = "ha_knob.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
